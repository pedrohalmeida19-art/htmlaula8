<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estoque</title>

    <style>
        body {
            font-family: Arial;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: #c91e29;
            color: white;
        }

        .baixo {
            background-color: #fff0cc;
        }
    </style>
</head>

<body>

    <h2 align="center">Estoque da loja de informática</h2>

    <table>
        <thead>
            <tr>
                <th colspan="2">Produto</th>
                <th colspan="2">Estoque</th>
            </tr>
            <tr>
                <th>Categoria</th>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="2">Periféricos</td>
                <td>Mouse</td>
                <td>R$ 80,00</td>
                <td>10</td>
            </tr>
            <tr class="baixo">
                <td>Teclado</td>
                <td>R$ 150,00</td>
                <td>3</td>
            </tr>
            <tr>
                <td rowspan="2">Armazenamento</td>
                <td>SSD</td>
                <td>R$ 220,00</td>
                <td>8</td>
            </tr>
            <tr class="baixo">
                <td>Pen drive</td>
                <td>R$ 45,00</td>
                <td>4</td>
            </tr>
            <tr>
                <td rowspan="2">Monitores</td>
                <td>Monitor 24</td>
                <td>R$ 900,00</td>
                <td>6</td>
            </tr>
            <tr class="baixo">
                <td>Monitor 27</td>
                <td>R$ 1.300,00</td>
                <td>2</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Total de unidades</td>
                <td>33</td>
            </tr>
        </tfoot>
    </table>

   

</body>
</html>

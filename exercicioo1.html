<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Tabela</title>

    <style>
        body {
            font-family: Arial;
        }

        table {
            margin: 40px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid black;
            padding: 15px;
            text-align: center;
            background-color: lightblue;
        }

        caption {
            font-weight: bold;
            padding: 10px;
        }
    </style>
</head>
<body>

    <table>
        <caption>Informações Pessoais</caption>

        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Matéria Favorita</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Pedro</td>
                <td>16 anos</td>
                <td>Programação</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Fim das informações</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
